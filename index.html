<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Exercise Tracker</title>

<style>

:root{
    --main:#2864e8;
    --bg:#eef4ff;
    --text:#172033;
    --card:#ffffff;
    --danger:#e52525;
    --muted:#777;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px 14px 50px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

.container{
    max-width:800px;
    margin:auto;
}

.card{
    background:var(--card);
    border-radius:28px;
    padding:28px 24px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    font-size:42px;
    margin:10px 0 35px;
    color:var(--main);
}

h2{
    text-align:center;
    font-size:38px;
    margin:35px 0 25px;
}

h3{
    margin:0 0 8px;
    font-size:22px;
}

.tabs{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.tab{
    border:0;
    border-radius:20px;
    padding:18px 8px;
    background:#dbe6ff;
    color:var(--text);
    font-size:16px;
    font-weight:800;
}

.tab.active{
    background:var(--main);
    color:white;
}

input,
textarea,
select{
    width:100%;
    padding:18px;
    border:2px solid #d5d5d5;
    border-radius:18px;
    font-size:18px;
    margin-bottom:14px;
    background:white;
}

textarea{
    min-height:120px;
    resize:vertical;
}

button{
    font-family:inherit;
    cursor:pointer;
}

.primary{
    width:100%;
    padding:19px;
    border:0;
    border-radius:18px;
    background:var(--main);
    color:white;
    font-size:21px;
    font-weight:800;
    margin-bottom:18px;
}

.danger{
    background:var(--danger);
}

.small{
    padding:12px 16px;
    border:0;
    border-radius:14px;
    background:var(--main);
    color:white;
    font-weight:700;
    font-size:15px;
}

.gray{
    background:#777;
}

.item{
    background:#f7f9fd;
    border-radius:20px;
    padding:20px;
    margin:18px 0;
}

.item-date{
    color:#777;
    font-size:16px;
    margin-bottom:14px;
}

.actions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:15px;
}

.actions button{
    padding:13px 8px;
    border:0;
    border-radius:14px;
    color:white;
    background:var(--main);
    font-weight:800;
    font-size:15px;
}

.actions .delete{
    background:var(--danger);
}

.empty{
    text-align:center;
    color:#777;
    font-size:18px;
    padding:25px;
}

.section{
    margin-top:20px;
}

.stat-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
    margin:20px 0;
}

.stat{
    background:#f4f7fc;
    border-radius:20px;
    padding:22px;
    text-align:center;
}

.stat-number{
    font-size:38px;
    font-weight:900;
    color:var(--main);
}

.stat-label{
    color:#777;
    font-weight:700;
}

.settings-label{
    display:block;
    font-size:19px;
    font-weight:800;
    margin:18px 0 8px;
}

.hidden{
    display:none;
}

.note{
    color:#777;
    font-size:15px;
    text-align:center;
    margin-top:20px;
}

@media(max-width:600px){

    h1{
        font-size:38px;
    }

    h2{
        font-size:34px;
    }

    .tabs{
        grid-template-columns:repeat(2,1fr);
    }

    .actions{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1 id="appTitle">🏋️ Exercise Tracker</h1>

<div class="tabs">

<button class="tab active" id="tabTasks" onclick="showSection('tasks')">
📋 Tasks
</button>

<button class="tab" id="tabRecords" onclick="showSection('records')">
📝 Records
</button>

<button class="tab" id="tabReview" onclick="showSection('review')">
📊 Review
</button>

<button class="tab" id="tabSettings" onclick="showSection('settings')">
⚙️ Settings
</button>

</div>


<!-- ================= TASKS ================= -->

<section id="tasks" class="section">

<h2>📋 Tasks</h2>

<input
id="taskInput"
type="text"
placeholder="Enter exercise goal"
>

<button class="primary" onclick="addTask()">
＋ Add Exercise Goal
</button>

<div id="taskList"></div>

</section>


<!-- ================= RECORDS ================= -->

<section id="records" class="section hidden">

<h2>📝 Records</h2>

<input
id="recordExercise"
type="text"
placeholder="Exercise name e.g. Swimming"
>

<input
id="recordAmount"
type="text"
placeholder="Amount e.g. 50 laps / 30 minutes / 20 reps"
>

<textarea
id="recordNotes"
placeholder="Notes (optional)"
></textarea>

<button class="primary" onclick="addRecord()">
＋ Save Exercise Record
</button>

<div id="recordList"></div>

</section>


<!-- ================= REVIEW ================= -->

<section id="review" class="section hidden">

<h2>📊 Review</h2>

<select id="reviewPeriod" onchange="displayReview()">

<option value="today">Today</option>
<option value="7">Last 7 Days</option>
<option value="30">Last 30 Days</option>
<option value="all">All Records</option>

</select>

<div class="stat-grid">

<div class="stat">

<div id="recordCount" class="stat-number">
0
</div>

<div class="stat-label">
Exercise Records
</div>

</div>

<div class="stat">

<div id="taskCount" class="stat-number">
0
</div>

<div class="stat-label">
Active Goals
</div>

</div>

</div>

<div id="reviewList"></div>

</section>


<!-- ================= SETTINGS ================= -->

<section id="settings" class="section hidden">

<h2>⚙️ Settings</h2>

<label class="settings-label">
App Title
</label>

<input
id="settingTitle"
type="text"
value="Exercise Tracker"
>

<label class="settings-label">
App Icon
</label>

<input
id="settingIcon"
type="text"
value="🏋️"
>

<label class="settings-label">
Main Colour
</label>

<input
id="settingMain"
type="color"
value="#2864e8"
>

<label class="settings-label">
Background Colour
</label>

<input
id="settingBg"
type="color"
value="#eef4ff"
>

<label class="settings-label">
Version
</label>

<input
id="settingVersion"
type="text"
value="1.0"
>

<label class="settings-label">
Notes / Comments
</label>

<textarea
id="settingNotes"
placeholder="Add version information, notes or comments..."
></textarea>

<button class="primary" onclick="saveSettings()">
💾 Save Settings
</button>

<button class="primary" onclick="resetSettings()">
↩️ Reset Settings
</button>

</section>

<p class="note">
Exercise Tracker • Your personal exercise record
</p>

</div>
</div>


<script>

/* =========================
   DATA
========================= */

let tasks =
JSON.parse(localStorage.getItem("exerciseTasks") || "[]");

let records =
JSON.parse(localStorage.getItem("exerciseRecords") || "[]");

let settings =
JSON.parse(localStorage.getItem("exerciseSettings") || "{}");


/* =========================
   SETTINGS
========================= */

function applySettings(){

    const title =
        settings.title || "Exercise Tracker";

    const icon =
        settings.icon || "🏋️";

    const main =
        settings.main || "#2864e8";

    const bg =
        settings.bg || "#eef4ff";

    document.documentElement.style
        .setProperty("--main",main);

    document.documentElement.style
        .setProperty("--bg",bg);

    document.getElementById("appTitle").textContent =
        icon + " " + title;

    document.getElementById("settingTitle").value =
        title;

    document.getElementById("settingIcon").value =
        icon;

    document.getElementById("settingMain").value =
        main;

    document.getElementById("settingBg").value =
        bg;

    document.getElementById("settingVersion").value =
        settings.version || "1.0";

    document.getElementById("settingNotes").value =
        settings.notes || "";
}


function saveSettings(){

    settings = {

        title:
        document.getElementById("settingTitle").value.trim()
        || "Exercise Tracker",

        icon:
        document.getElementById("settingIcon").value.trim()
        || "🏋️",

        main:
        document.getElementById("settingMain").value,

        bg:
        document.getElementById("settingBg").value,

        version:
        document.getElementById("settingVersion").value.trim()
        || "1.0",

        notes:
        document.getElementById("settingNotes").value.trim()

    };

    localStorage.setItem(
        "exerciseSettings",
        JSON.stringify(settings)
    );

    applySettings();

    alert("Settings saved.");

}


function resetSettings(){

    if(!confirm("Reset settings to default?")){
        return;
    }

    settings = {

        title:"Exercise Tracker",
        icon:"🏋️",
        main:"#2864e8",
        bg:"#eef4ff",
        version:"1.0",
        notes:""

    };

    localStorage.setItem(
        "exerciseSettings",
        JSON.stringify(settings)
    );

    applySettings();

}


/* =========================
   NAVIGATION
========================= */

function showSection(section){

    const sections =
        ["tasks","records","review","settings"];

    sections.forEach(id => {

        document.getElementById(id)
            .classList.add("hidden");

    });

    document.getElementById(section)
        .classList.remove("hidden");


    document.querySelectorAll(".tab")
        .forEach(tab => tab.classList.remove("active"));


    document.getElementById(
        "tab" +
        section.charAt(0).toUpperCase() +
        section.slice(1)
    ).classList.add("active");


    if(section === "tasks"){
        displayTasks();
    }

    if(section === "records"){
        displayRecords();
    }

    if(section === "review"){
        displayReview();
    }

}


/* =========================
   TASKS
========================= */

function addTask(){

    const input =
        document.getElementById("taskInput");

    const text =
        input.value.trim();

    if(text === ""){
        alert("Please enter an exercise goal.");
        return;
    }

    tasks.push({

        id:Date.now(),

        text:text,

        done:false,

        date:new Date().toLocaleString()

    });

    localStorage.setItem(
        "exerciseTasks",
        JSON.stringify(tasks)
    );

    input.value = "";

    displayTasks();

}


function displayTasks(){

    const list =
        document.getElementById("taskList");

    list.innerHTML = "";


    if(tasks.length === 0){

        list.innerHTML =
            '<div class="empty">No exercise goals yet.</div>';

        return;

    }


    tasks.forEach(task => {

        const div =
            document.createElement("div");

        div.className = "item";


        div.innerHTML = `

            <h3 style="
                ${task.done
                ? "text-decoration:line-through;color:#777;"
                : ""}
            ">
                ${escapeHtml(task.text)}
            </h3>

            <div class="item-date">
                Added ${escapeHtml(task.date)}
            </div>

            <div class="actions">

                <button onclick="toggleTask(${task.id})">
                    ${task.done ? "↩️ Undo" : "✅ Done"}
                </button>

                <button onclick="editTask(${task.id})">
                    ✏️ Edit
                </button>

                <button
                    class="delete"
                    onclick="deleteTask(${task.id})">
                    🗑️ Delete
                </button>

            </div>
        `;

        list.appendChild(div);

    });

}


function toggleTask(id){

    const task =
        tasks.find(t => t.id === id);

    if(!task) return;

    task.done = !task.done;

    localStorage.setItem(
        "exerciseTasks",
        JSON.stringify(tasks)
    );

    displayTasks();

}


function editTask(id){

    const task =
        tasks.find(t => t.id === id);

    if(!task) return;

    const newText =
        prompt("Edit exercise goal:",task.text);

    if(newText === null) return;

    const clean =
        newText.trim();

    if(clean === "") return;

    task.text = clean;

    localStorage.setItem(
        "exerciseTasks",
        JSON.stringify(tasks)
    );

    displayTasks();

}


function deleteTask(id){

    if(!confirm("Delete this exercise goal?")){
        return;
    }

    tasks =
        tasks.filter(t => t.id !== id);

    localStorage.setItem(
        "exerciseTasks",
        JSON.stringify(tasks)
    );

    displayTasks();

}


/* =========================
   RECORDS
========================= */

function addRecord(){

    const exercise =
        document.getElementById("recordExercise")
        .value.trim();

    const amount =
        document.getElementById("recordAmount")
        .value.trim();

    const notes =
        document.getElementById("recordNotes")
        .value.trim();


    if(exercise === ""){

        alert("Please enter the exercise name.");

        return;

    }


    records.push({

        id:Date.now(),

        exercise:exercise,

        amount:amount,

        notes:notes,

        date:new Date().toISOString()

    });


    localStorage.setItem(
        "exerciseRecords",
        JSON.stringify(records)
    );


    document.getElementById("recordExercise")
        .value = "";

    document.getElementById("recordAmount")
        .value = "";

    document.getElementById("recordNotes")
        .value = "";


    displayRecords();

    alert("Exercise record saved.");

}


function displayRecords(){

    const list =
        document.getElementById("recordList");

    list.innerHTML = "";


    if(records.length === 0){

        list.innerHTML =
            '<div class="empty">No exercise records yet.</div>';

        return;

    }


    const sorted =
        [...records].sort(
            (a,b) =>
            new Date(b.date) -
            new Date(a.date)
        );


    sorted.forEach(record => {

        const div =
            document.createElement("div");

        div.className = "item";


        div.innerHTML = `

            <h3>
                ${escapeHtml(record.exercise)}
            </h3>

            <div class="item-date">
                ${formatDate(record.date)}
            </div>

            ${
                record.amount
                ?
                `<p><strong>Amount:</strong>
                ${escapeHtml(record.amount)}</p>`
                :
                ""
            }

            ${
                record.notes
                ?
                `<p>${escapeHtml(record.notes)}</p>`
                :
                ""
            }

            <div class="actions">

                <button onclick="editRecord(${record.id})">
                    ✏️ Edit
                </button>

                <button
                    class="delete"
                    onclick="deleteRecord(${record.id})">
                    🗑️ Delete
                </button>

            </div>

        `;

        list.appendChild(div);

    });

}


function editRecord(id){

    const record =
        records.find(r => r.id === id);

    if(!record) return;


    const exercise =
        prompt(
            "Exercise:",
            record.exercise
        );

    if(exercise === null) return;


    const amount =
        prompt(
            "Amount:",
            record.amount
        );

    if(amount === null) return;


    const notes =
        prompt(
            "Notes:",
            record.notes
        );

    if(notes === null) return;


    record.exercise =
        exercise.trim();

    record.amount =
        amount.trim();

    record.notes =
        notes.trim();


    localStorage.setItem(
        "exerciseRecords",
        JSON.stringify(records)
    );


    displayRecords();

}


function deleteRecord(id){

    if(!confirm("Delete this exercise record?")){
        return;
    }

    records =
        records.filter(r => r.id !== id);

    localStorage.setItem(
        "exerciseRecords",
        JSON.stringify(records)
    );

    displayRecords();

}


/* =========================
   REVIEW
========================= */

function displayReview(){

    const period =
        document.getElementById("reviewPeriod")
        .value;


    let filtered = [...records];


    const now =
        new Date();


    if(period === "today"){

        filtered =
            records.filter(record => {

                const d =
                    new Date(record.date);

                return (
                    d.getFullYear() === now.getFullYear() &&
                    d.getMonth() === now.getMonth() &&
                    d.getDate() === now.getDate()
                );

            });

    }


    if(period === "7"){

        const cutoff =
            new Date();

        cutoff.setDate(
            cutoff.getDate() - 7
        );

        filtered =
            records.filter(
                r => new Date(r.date) >= cutoff
            );

    }


    if(period === "30"){

        const cutoff =
            new Date();

        cutoff.setDate(
            cutoff.getDate() - 30
        );

        filtered =
            records.filter(
                r => new Date(r.date) >= cutoff
            );

    }


    document.getElementById("recordCount")
        .textContent = filtered.length;


    document.getElementById("taskCount")
        .textContent =
        tasks.filter(t => !t.done).length;


    const list =
        document.getElementById("reviewList");

    list.innerHTML = "";


    if(filtered.length === 0){

        list.innerHTML =
            '<div class="empty">No exercise records for this period.</div>';

        return;

    }


    filtered
        .sort(
            (a,b) =>
            new Date(b.date) -
            new Date(a.date)
        )
        .forEach(record => {

            const div =
                document.createElement("div");

            div.className = "item";


            div.innerHTML = `

                <h3>
                    ${escapeHtml(record.exercise)}
                </h3>

                <div class="item-date">
                    ${formatDate(record.date)}
                </div>

                ${
                    record.amount
                    ?
                    `<p><strong>${escapeHtml(record.amount)}</strong></p>`
                    :
                    ""
                }

                ${
                    record.notes
                    ?
                    `<p>${escapeHtml(record.notes)}</p>`
                    :
                    ""
                }

            `;

            list.appendChild(div);

        });

}


/* =========================
   HELPERS
========================= */

function formatDate(date){

    return new Date(date)
        .toLocaleString();

}


function escapeHtml(text){

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


/* =========================
   START APP
========================= */

applySettings();

displayTasks();

</script>

</body>
</html>
