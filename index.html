<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Universal Tracker</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #eef4ff;
      text-align: center;
      padding: 30px 20px;
      color: #172033;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 30px 20px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      color: #2563eb;
      font-size: 30px;
    }

    button {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 12px 0;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>📋 Universal Tracker</h1>

    <p>Your reusable task and record tracker.</p>

    <button>＋ New Task</button>

    <button>＋ New Record</button>

    <button>📊 Review</button>

    <button>⚙️ Settings</button>

    <p>Version 1.0</p>

  </div>

</body>
</html>
