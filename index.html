<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Universal Tracker</title>

<style>

:root{
--main-color:#2563eb;
--background-color:#eef4ff;
}

*{
box-sizing:border-box;
}

body{

font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;

background:var(--background-color);

color:#172033;

margin:0;

padding:18px 12px 40px;

}

.card{

max-width:700px;

margin:auto;

background:white;

padding:22px 18px;

border-radius:24px;

box-shadow:
0 5px 20px rgba(0,0,0,0.08);

}

h1{

color:var(--main-color);

text-align:center;

font-size:34px;

margin:15px 0 25px;

}

h2{

text-align:center;

font-size:28px;

margin:25px 0;

}

.tabs{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:7px;

margin-bottom:25px;

}

.tabs button{

padding:12px 4px;

border:0;

border-radius:12px;

background:#dce6ff;

color:#172033;

font-weight:bold;

font-size:14px;

}

.tabs button.active{

background:var(--main-color);

color:white;

}

button{

padding:13px;

margin:5px 0;

border:0;

border-radius:12px;

background:var(--main-color);

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

}

.primary{

width:100%;

}

input,
textarea,
select{

width:100%;

padding:14px;

box-sizing:border-box;

border:1px solid #ccc;

border-radius:12px;

font-size:16px;

margin:5px 0 12px;

font-family:inherit;

}

textarea{

min-height:120px;

resize:vertical;

}

label{

display:block;

font-weight:bold;

margin-top:10px;

}

input[type="color"]{

height:55px;

padding:5px;

}

.item{

padding:16px 0;

border-bottom:1px solid #ddd;

}

.item:last-child{

border-bottom:0;

}

.done{

text-decoration:line-through;

color:#888;

}

.small{

color:#777;

font-size:14px;

margin-top:5px;

}

.actions{

display:flex;

gap:7px;

margin-top:8px;

}

.actions button{

flex:1;

font-size:14px;

padding:11px 5px;

}

.delete{

background:#dc2626;

}

.empty{

text-align:center;

color:#777;

padding:30px 5px;

}

.record{

background:#f7f9fc;

padding:15px;

border-radius:14px;

margin:12px 0;

}

.reviewCard{

background:#f7f9fc;

padding:16px;

border-radius:14px;

margin:12px 0;

}

.stat{

text-align:center;

font-size:42px;

font-weight:bold;

color:var(--main-color);

}

.hidden{

display:none;

}

.noteBox{

background:#f7f9fc;

padding:15px;

border-radius:14px;

margin-top:15px;

white-space:pre-wrap;

}

.version{

text-align:center;

font-weight:bold;

margin-top:20px;

color:#666;

}

@media(max-width:500px){

h1{

font-size:30px;

}

.tabs button{

font-size:12px;

}

.actions{

flex-direction:row;

}

}

</style>

</head>


<body>


<div class="card">


<h1 id="appHeading">
📋 Universal Tracker
</h1>


<!-- =========================
     TABS
========================= -->

<div class="tabs">


<button
id="taskTab"
onclick="showTasks()">

📋 Tasks

</button>


<button
id="recordTab"
onclick="showRecords()">

📝 Records

</button>


<button
id="reviewTab"
onclick="showReview()">

📊 Review

</button>


<button
id="settingsTab"
onclick="showSettings()">

⚙️ Settings

</button>


</div>



<!-- =========================
     TASKS
========================= -->

<div
id="tasksSection">


<h2>📋 Tasks</h2>


<input
id="taskInput"
placeholder="Enter a new task">


<button
class="primary"
onclick="addTask()">

＋ Add Task

</button>


<div
id="taskList">
</div>


</div>



<!-- =========================
     RECORDS
========================= -->

<div
id="recordsSection"
class="hidden">


<h2>📝 Records</h2>


<input
id="recordTitle"
placeholder="Record title">


<textarea
id="recordDetails"
placeholder="Enter details or notes...">
</textarea>


<button
class="primary"
onclick="addRecord()">

＋ Add Record

</button>


<div
id="recordList">
</div>


</div>



<!-- =========================
     REVIEW
========================= -->

<div
id="reviewSection"
class="hidden">


<h2>📊 Review</h2>


<select
id="reviewPeriod"
onchange="displayReview()">

<option value="today">
Today
</option>

<option value="7">
Last 7 Days
</option>

<option value="30">
Last 30 Days
</option>

<option value="all">
All Records
</option>

</select>


<div class="reviewCard">

<div class="small">
Records in selected period
</div>


<div
class="stat"
id="recordCount">

0

</div>


</div>


<div
id="reviewList">
</div>


</div>



<!-- =========================
     SETTINGS
========================= -->

<div
id="settingsSection"
class="hidden">


<h2>⚙️ Settings</h2>


<label>
App Title
</label>


<input
id="appTitle"
placeholder="Universal Tracker">


<label>
App Icon
</label>


<input
id="appIcon"
placeholder="📋">


<label>
Main Colour
</label>


<input
id="mainColor"
type="color"
value="#2563eb">


<label>
Background Colour
</label>


<input
id="backgroundColor"
type="color"
value="#eef4ff">


<label>
Version
</label>


<input
id="appVersion"
placeholder="1.0">


<label>
Notes / Comments
</label>


<textarea
id="appNotes"
placeholder="Add version information, notes or comments...">
</textarea>


<button
class="primary"
onclick="saveSettings()">

💾 Save Settings

</button>


<button
class="primary"
onclick="resetSettings()">

↩️ Reset Settings

</button>


<div
id="settingsNotes"
class="noteBox hidden">
</div>


<div
class="version"
id="versionDisplay">
Version 1.0
</div>


</div>


</div>



<script>


/* =========================
   DATA
========================= */


let tasks =
JSON.parse(
localStorage.getItem("tasks")
|| "[]"
);


let records =
JSON.parse(
localStorage.getItem("records")
|| "[]"
);



/* =========================
   SETTINGS
========================= */


let settings =
JSON.parse(
localStorage.getItem(
"trackerSettings"
)
|| "null"
);


if(!settings){

settings={

title:"Universal Tracker",

icon:"📋",

mainColor:"#2563eb",

backgroundColor:"#eef4ff",

version:"1.0",

notes:""

};

}



/* =========================
   SAVE DATA
========================= */


function saveTasks(){

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

}


function saveRecords(){

localStorage.setItem(
"records",
JSON.stringify(records)
);

}



/* =========================
   APPLY SETTINGS
========================= */


function applySettings(){

document.title =
settings.title;


document.getElementById(
"appHeading"
).textContent =
settings.icon
+" "
+settings.title;


document.documentElement
.style.setProperty(
"--main-color",
settings.mainColor
);


document.documentElement
.style.setProperty(
"--background-color",
settings.backgroundColor
);


document.getElementById(
"versionDisplay"
).textContent =
"Version "
+settings.version;


let notes=
document.getElementById(
"settingsNotes"
);


if(settings.notes){

notes.textContent=
settings.notes;

notes.classList.remove(
"hidden"
);

}else{

notes.classList.add(
"hidden"
);

}

}



/* =========================
   LOAD SETTINGS
========================= */


function loadSettings(){

document.getElementById(
"appTitle"
).value =
settings.title;


document.getElementById(
"appIcon"
).value =
settings.icon;


document.getElementById(
"mainColor"
).value =
settings.mainColor;


document.getElementById(
"backgroundColor"
).value =
settings.backgroundColor;


document.getElementById(
"appVersion"
).value =
settings.version;


document.getElementById(
"appNotes"
).value =
settings.notes;

}



/* =========================
   SAVE SETTINGS
========================= */


function saveSettings(){

settings={

title:
document.getElementById(
"appTitle"
).value.trim()
||"Universal Tracker",


icon:
document.getElementById(
"appIcon"
).value.trim()
||"📋",


mainColor:
document.getElementById(
"mainColor"
).value,


backgroundColor:
document.getElementById(
"backgroundColor"
).value,


version:
document.getElementById(
"appVersion"
).value.trim()
||"1.0",


notes:
document.getElementById(
"appNotes"
).value.trim()

};


localStorage.setItem(
"trackerSettings",
JSON.stringify(settings)
);


applySettings();


alert(
"Settings saved successfully."
);

}



/* =========================
   RESET SETTINGS
========================= */


function resetSettings(){

if(!confirm(
"Reset app settings?"
)){

return;

}


settings={

title:"Universal Tracker",

icon:"📋",

mainColor:"#2563eb",

backgroundColor:"#eef4ff",

version:"1.0",

notes:""

};


localStorage.setItem(
"trackerSettings",
JSON.stringify(settings)
);


loadSettings();

applySettings();

}



/* =========================
   TASK DISPLAY
========================= */


function displayTasks(){

let list=
document.getElementById(
"taskList"
);


if(tasks.length===0){

list.innerHTML=
"<div class='empty'>No tasks yet.</div>";

return;

}


list.innerHTML="";


tasks.forEach(
function(task,index){

let div=
document.createElement(
"div"
);


div.className="item";


div.innerHTML=`

<div class="${task.done?"done":""}">

<strong>
${escapeHTML(task.text)}
</strong>

</div>

<div class="small">

${task.date}

</div>

<div class="actions">

<button
onclick="completeTask(${index})">

${task.done
?"↩️ Undo"
:"✅ Done"}

</button>

<button
onclick="editTask(${index})">

✏️ Edit

</button>

<button
class="delete"
onclick="deleteTask(${index})">

🗑️ Delete

</button>

</div>

`;


list.appendChild(div);

});

}



/* =========================
   ADD TASK
========================= */


function addTask(){

let input=
document.getElementById(
"taskInput"
);


let text=
input.value.trim();


if(text===""){

alert(
"Please enter a task."
);

return;

}


tasks.push({

text:text,

done:false,

date:new Date()
.toLocaleString()

});


input.value="";


saveTasks();

displayTasks();

}



/* =========================
   COMPLETE TASK
========================= */


function completeTask(index){

tasks[index].done=
!tasks[index].done;


saveTasks();

displayTasks();

}



/* =========================
   EDIT TASK
========================= */


function editTask(index){

let newText=
prompt(
"Edit task:",
tasks[index].text
);


if(newText===null){

return;

}


newText=
newText.trim();


if(newText===""){

return;

}


tasks[index].text=
newText;


saveTasks();

displayTasks();

}



/* =========================
   DELETE TASK
========================= */


function deleteTask(index){

if(
confirm(
"Delete this task?"
)
){

tasks.splice(index,1);

saveTasks();

displayTasks();

}

}



/* =========================
   RECORD DISPLAY
========================= */


function displayRecords(){

let list=
document.getElementById(
"recordList"
);


if(records.length===0){

list.innerHTML=
"<div class='empty'>No records yet.</div>";

return;

}


list.innerHTML="";


records
.slice()
.reverse()
.forEach(
function(record,index){

let actualIndex=
records.length-1-index;


let div=
document.createElement(
"div"
);


div.className="record";


div.innerHTML=`

<strong>
${escapeHTML(record.title)}
</strong>

<div class="small">

${new Date(record.date)
.toLocaleString()}

</div>

<p>

${escapeHTML(record.details)}

</p>

<div class="actions">

<button
onclick="editRecord(${actualIndex})">

✏️ Edit

</button>

<button
class="delete"
onclick="deleteRecord(${actualIndex})">

🗑️ Delete

</button>

</div>

`;


list.appendChild(div);

});

}



/* =========================
   ADD RECORD
========================= */


function addRecord(){

let title=
document.getElementById(
"recordTitle"
).value.trim();


let details=
document.getElementById(
"recordDetails"
).value.trim();


if(title===""){

alert(
"Please enter a record title."
);

return;

}


records.push({

title:title,

details:details,

date:new Date()
.toISOString()

});


document.getElementById(
"recordTitle"
).value="";


document.getElementById(
"recordDetails"
).value="";


saveRecords();

displayRecords();

}



/* =========================
   EDIT RECORD
========================= */


function editRecord(index){

let record=
records[index];


let newTitle=
prompt(
"Edit record title:",
record.title
);


if(newTitle===null){

return;

}


newTitle=
newTitle.trim();


if(newTitle===""){

return;

}


let newDetails=
prompt(
"Edit record details:",
record.details
);


if(newDetails===null){

return;

}


record.title=
newTitle;


record.details=
newDetails;


saveRecords();

displayRecords();

}



/* =========================
   DELETE RECORD
========================= */


function deleteRecord(index){

if(
confirm(
"Delete this record?"
)
){

records.splice(index,1);

saveRecords();

displayRecords();

}

}



/* =========================
   REVIEW
========================= */


function displayReview(){

let period=
document.getElementById(
"reviewPeriod"
).value;


let list=
records.slice();


if(period!=="all"){

let days=
period==="today"
?1
:Number(period);


let start=
new Date();


start.setHours(
0,0,0,0
);


start.setDate(
start.getDate()
-days+1
);


list=
list.filter(
function(record){

return new Date(
record.date
)>=start;

});

}


document.getElementById(
"recordCount"
).textContent=
list.length;


let review=
document.getElementById(
"reviewList"
);


if(list.length===0){

review.innerHTML=
"<div class='empty'>No records for this period.</div>";

return;

}


list.sort(
function(a,b){

return new Date(b.date)
-
new Date(a.date);

});


review.innerHTML="";


list.forEach(
function(record){

let div=
document.createElement(
"div"
);


div.className=
"reviewCard";


div.innerHTML=`

<strong>
${escapeHTML(record.title)}
</strong>

<div class="small">

${new Date(record.date)
.toLocaleString()}

</div>

<p>

${escapeHTML(record.details)}

</p>

`;


review.appendChild(div);

});

}



/* =========================
   TAB FUNCTIONS
========================= */


function clearTabs(){

document
.querySelectorAll(
".tabs button"
)
.forEach(
function(button){

button.classList.remove(
"active"
);

});

}



function hideSections(){

document
.getElementById(
"tasksSection"
)
.classList.add(
"hidden"
);


document
.getElementById(
"recordsSection"
)
.classList.add(
"hidden"
);


document
.getElementById(
"reviewSection"
)
.classList.add(
"hidden"
);


document
.getElementById(
"settingsSection"
)
.classList.add(
"hidden"
);

}



/* =========================
   SHOW TASKS
========================= */


function showTasks(){

hideSections();

clearTabs();


document
.getElementById(
"tasksSection"
)
.classList.remove(
"hidden"
);


document
.getElementById(
"taskTab"
)
.classList.add(
"active"
);


displayTasks();

}



/* =========================
   SHOW RECORDS
========================= */


function showRecords(){

hideSections();

clearTabs();


document
.getElementById(
"recordsSection"
)
.classList.remove(
"hidden"
);


document
.getElementById(
"recordTab"
)
.classList.add(
"active"
);


displayRecords();

}



/* =========================
   SHOW REVIEW
========================= */


function showReview(){

hideSections();

clearTabs();


document
.getElementById(
"reviewSection"
)
.classList.remove(
"hidden"
);


document
.getElementById(
"reviewTab"
)
.classList.add(
"active"
);


displayReview();

}



/* =========================
   SHOW SETTINGS
========================= */


function showSettings(){

hideSections();

clearTabs();


document
.getElementById(
"settingsSection"
)
.classList.remove(
"hidden"
);


document
.getElementById(
"settingsTab"
)
.classList.add(
"active"
);


loadSettings();

}



/* =========================
   SAFETY
========================= */


function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}



/* =========================
   START APP
========================= */


applySettings();

showTasks();


</script>

</body>

</html>
